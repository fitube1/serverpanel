version: '3.8'

services:
  serverpanel:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: serverpanel
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent application data (db, config, apps)
      - serverpanel_data:/data
      
      # Required for Docker management module
      - /var/run/docker.sock:/var/run/docker.sock
    
    environment:
      - NODE_ENV=production
      - TZ=UTC

volumes:
  serverpanel_data:
    name: serverpanel_data
